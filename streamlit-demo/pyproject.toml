[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "streamlit-demo"
version = "1.0.0"
description = "Streamlit demo: 100 rising random numbers with rolling average"
requires-python = ">=3.12"
dependencies = [
    "streamlit>=1.32.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/streamlit_demo"]
