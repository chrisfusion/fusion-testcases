[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "onepackage-cli"
version = "1.0.0"
description = "Self-contained console entry point installed via pip wheel"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
onepackage-cli = "onepackage_cli.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/onepackage_cli"]
