[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "metrics-lib"
version = "1.0.0"
description = "Plain importable library: rolling-window summary stats, no console entry point"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/metrics_lib"]
