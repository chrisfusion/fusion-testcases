# SPDX-License-Identifier: GPL-3.0-or-later
# One WeaveJobTemplate + one codeSource artifact (app.etl-pipeline) shared by
# all 5 chain steps. Each step only differs by ENTRYPOINT (envOverrides),
# picking which flat script in the repo to run:
#
#   extract -> {transform_customers, transform_orders} (parallel) -> merge -> load
#
# This is an app build (POST /api/v1/appbuilds or a GitWatcher with
# buildType: app) with a metadata.yaml — but that metadata.yaml deliberately
# sets no runner.args (only runner.type). That matters: runner.args keys are
# appended to the container env by codesource.EnvVars AFTER step.envOverrides
# and win on duplicate keys (last-value-wins) — if metadata set
# runner.args.ENTRYPOINT, every step's ENTRYPOINT override would be silently
# ignored. runner.type alone is safe (it only sets WEAVE_RUNNER_TYPE, so the
# static override below is no longer needed) — see metadata.yaml and
# EXPLANATION.md for the full mechanism, and ../../README.md.
#
# The 5 scripts are uploaded automatically as sibling files on the artifact's
# fusion-index version via metadata.yaml's `files: []` (auto-discover mode) —
# no more out-of-band per-file upload. Publish either:
#   - one-off: POST /api/v1/appbuilds (JSON: repo_url, repo_ref, project_dir)
#     against fusion-forge, then move the "stable" tag to the resulting
#     version (PUT .../tags/stable needs both "version" and "versionId")
#   - GitOps: a GitWatcher with buildType: app, projectDir pointing here
#
# Fire:
#   kubectl annotate weavetrigger etl-pipeline-trigger fusion-platform.io/fire=true --overwrite -n fusion
# Monitor:
#   kubectl get fr -n fusion -w
---
apiVersion: weave.fusion-platform.io/v1alpha1
kind: WeaveJobTemplate
metadata:
  name: etl-pipeline
  namespace: fusion
spec:
  image: fusion-runner-python312:local
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 256Mi
  codeSource:
    artifactName: app.etl-pipeline
    tag: stable
---
apiVersion: weave.fusion-platform.io/v1alpha1
kind: WeaveChain
metadata:
  name: etl-pipeline
  namespace: fusion
spec:
  failurePolicy: StopAll
  concurrencyPolicy: Wait
  steps:
    - name: extract
      jobTemplateRef:
        name: etl-pipeline
      envOverrides:
        - name: ENTRYPOINT
          value: extract.py
    - name: transform-customers
      dependsOn: [extract]
      jobTemplateRef:
        name: etl-pipeline
      envOverrides:
        - name: ENTRYPOINT
          value: transform_customers.py
    - name: transform-orders
      dependsOn: [extract]
      jobTemplateRef:
        name: etl-pipeline
      envOverrides:
        - name: ENTRYPOINT
          value: transform_orders.py
    - name: merge
      dependsOn: [transform-customers, transform-orders]
      jobTemplateRef:
        name: etl-pipeline
      envOverrides:
        - name: ENTRYPOINT
          value: merge.py
    - name: load
      dependsOn: [merge]
      jobTemplateRef:
        name: etl-pipeline
      envOverrides:
        - name: ENTRYPOINT
          value: load.py
---
apiVersion: weave.fusion-platform.io/v1alpha1
kind: WeaveTrigger
metadata:
  name: etl-pipeline-trigger
  namespace: fusion
spec:
  chainRef:
    name: etl-pipeline
  type: OnDemand
