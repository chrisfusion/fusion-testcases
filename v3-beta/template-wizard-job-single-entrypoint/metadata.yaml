# Read by fusion-forge (app build, started by the wizard's GitWatcher step).
# name/version/builderImage come from here, not from the wizard form.

# Artifact name in fusion-index -> `app.template-wizard-job-single-entrypoint`.
name: template-wizard-job-single-entrypoint
# Bump this to publish a new artifact version (an existing version is not rebuilt).
version: 0.1.0
maintainer: some.maintainer@example.local

# Image the build runs in; python3.12 = Python 3.12 venv.
builderImage: python3.12

# Ship the non-.py files of the repo root (here: kafka_excerpt.txt) inside the venv
# as the importable package `_root_assets`. Without this flag they are NOT shipped.
# Excluded automatically: requirements.txt, metadata.yaml, dotfiles, symlinks.
# Every other non-.py root file (the READMEs) is bundled too - expected, harmless.
rootAssets: true

# How the job is started by fusion-runner.
runner:
  # `python` = run the entrypoint directly, no web server, no port -> a Job step.
  type: python
  args:
    # Single entrypoint: main.py. The wizard form also lists "main.py" under
    # entrypoints; both say the same, so nothing conflicts.
    ENTRYPOINT: "main.py"

resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "300m"
    memory: "256Mi"
