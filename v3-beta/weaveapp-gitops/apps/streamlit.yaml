# Streamlit service from a fusion-forge build, no ingress tuning.
# Code: ../template-wizard-service-streamlit (runner.type=streamlit, runner.port=8501).
# The port comes from metadata.yaml, so service.ports can be left out.
# Controller-specific tuning lives in ../streamlit-nginx and ../streamlit-traefik.
apiVersion: weave.fusion-platform.io/v1alpha1
kind: WeaveApp
metadata:
  name: streamlit
  namespace: fusion
spec:
  type: service
  image: fusion-runner-python312:local
  codeSource:
    artifactName: app.template-wizard-service-streamlit
    tag: stable                      # moving the tag restarts the pods with the new version
  # Read-only root filesystem: the runner unpacks the venv to /tmp/venv, so /tmp must be a
  # writable emptyDir. sizeLimit caps it (the pod is evicted beyond it). The platform may
  # already give every runner /tmp (WRITABLE_PATHS / codeSource.runnerWritablePaths); listing
  # it again here is harmless and only sets the sizeLimit.
  containerSecurityContext:
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
  writablePaths:
    - mountPath: /tmp
      sizeLimit: 1Gi
    # An app-specific extra path, appended by the app: Streamlit's per-user state directory
    # (HOME=/home/runner in the runner image). This app starts without it (only /tmp is
    # required); add such entries when your app or its libraries write somewhere else.
    - mountPath: /home/runner/.streamlit
      sizeLimit: 10Mi
      medium: Memory          # tmpfs: tiny, and counts against the memory limit
  service:
    replicas: 1
    readinessProbe:
      httpGet: {path: /_stcore/health, port: 8501}
      initialDelaySeconds: 10
      periodSeconds: 10
      failureThreshold: 6
    # -> words.<ingress.hostSuffix>. Instance-wide ingress.annotations and, because the
    # artifact's runner.type is streamlit, ingress.runnerAnnotations.streamlit still apply.
    ingressName: words
