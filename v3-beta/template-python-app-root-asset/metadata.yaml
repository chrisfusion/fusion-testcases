# Read by fusion-forge (app build). name/version/builderImage come from here,
# not from the API call.

# Artifact name in fusion-index -> `app.template-python-app-root-asset`.
name: template-python-app-root-asset
# Bump this to publish a new artifact version (an existing version is not rebuilt).
version: 0.1.0
maintainer: some.maintainer@example.local

# Image the build runs in; python3.12 = Python 3.12 venv.
builderImage: python3.12

# Bundle the non-.py files in the repo root (here: words.txt) into the importable
# package `_root_assets` inside the venv. Without this flag words.txt is NOT shipped.
# Excluded automatically: requirements.txt, metadata.yaml, dotfiles, symlinks.
rootAssets: true

# How the app is started by fusion-runner.
runner:
  # `python` = run the entrypoint directly, no web server, no port, no ingress
  # -> a one-shot application, suited for a Job step.
  type: python
  args:
    # Script that is executed: main.py in the repo root.
    ENTRYPOINT: "main.py"

resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "300m"
    memory: "256Mi"
